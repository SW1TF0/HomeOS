name: Native apps

# Builds the native SmartHomeKJ apps (Kotlin for Android, Swift for Apple) for free on GitHub's runners.
# Running it by hand with a version (like native-v0.1.0) publishes them as a pre-release, so the Flutter app stays on
# releases/latest. The newest native builds are also always at the native-latest release.
on:
  push:
    branches: [main, 'claude/native-**']
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a pre-release with this tag (e.g. native-v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The same signing key as the Flutter app, made from a secret, so every native version installs over the last.
      - name: Make the signing key
        env:
          ANDROID_SIGNING_SECRET: ${{ secrets.ANDROID_SIGNING_SECRET }}
        run: |
          if [ -z "$ANDROID_SIGNING_SECRET" ]; then
            echo "::warning::No ANDROID_SIGNING_SECRET, so this APK gets a one-off key and does not install over other versions."
            ANDROID_SIGNING_SECRET=$(openssl rand -hex 32)
          fi
          pip install --quiet cryptography==50.0.1
          ANDROID_SIGNING_SECRET="$ANDROID_SIGNING_SECRET" python ../../tool/android_key.py app/release-key.p12 >> "$GITHUB_ENV"
      - name: Test the core and build the APK
        run: |
          version="${{ inputs.version }}"
          version="${version#native-v}"
          ./gradlew --no-daemon :core:test :app:assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName="${version:-0.1.0-dev.${{ github.run_number }}}"
      - run: mv app/build/outputs/apk/release/app-release.apk ../../SmartMenuKJ-native-android.apk
      - name: Check which key signed the APK
        working-directory: .
        run: |
          signer=$(python tool/android_key.py --signer SmartMenuKJ-native-android.apk)
          echo "Signed by $signer"
          if [ "$signer" != "$APP_KEY_SHA256" ]; then
            echo "::error::The APK is not signed with the key made for it ($APP_KEY_SHA256)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: native/android/core/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-native-android
          path: SmartMenuKJ-native-android.apk

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: native/apple
    steps:
      - uses: actions/checkout@v4
      - name: Test the Swift core
        run: swift test
      - name: Make the Xcode project
        working-directory: native/apple/App
        run: |
          brew install xcodegen
          version="${{ inputs.version }}"
          version="${version#native-v}"
          sed -i '' "s/MARKETING_VERSION: \"0.1.0\"/MARKETING_VERSION: \"${version:-0.1.0}\"/; s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen
      # Signed "to run locally" (ad hoc): free, no Apple account. macOS asks once, on first open, to confirm it.
      - name: Build the Mac app
        working-directory: native/apple/App
        run: |
          xcodebuild -project SmartMenuKJ.xcodeproj -scheme SmartMenuKJ-macOS -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build > mac.log 2>&1 \
            || { grep -E "error:" mac.log | sort -u | head -80; tail -n 30 mac.log; exit 1; }
          test -d build/Build/Products/Release/SmartHomeKJ.app
          ditto -c -k --keepParent build/Build/Products/Release/SmartHomeKJ.app ../../../SmartMenuKJ-native-macos.zip
      # iPhone apps need a paid Apple developer account to install, so this only checks that the iPhone app builds, and
      # keeps an unsigned copy for people who sign apps themselves.
      - name: Build the iPhone app (unsigned)
        working-directory: native/apple/App
        run: |
          xcodebuild -project SmartMenuKJ.xcodeproj -scheme SmartMenuKJ-iOS -configuration Release \
            -derivedDataPath build-ios -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > ios.log 2>&1 \
            || { grep -E "error:" ios.log | sort -u | head -80; tail -n 30 ios.log; exit 1; }
          mkdir -p Payload
          cp -R build-ios/Build/Products/Release-iphoneos/SmartHomeKJ.app Payload/
          zip -qr ../../../SmartMenuKJ-native-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-native-apple
          path: |
            SmartMenuKJ-native-macos.zip
            SmartMenuKJ-native-ios-unsigned.ipa

  release:
    if: inputs.version != ''
    needs: [android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SmartMenuKJ-native-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.version }}
          name: SmartHomeKJ native ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
      # A fixed address for the newest native builds: delete the old native-latest and make it again here.
      - name: Move native-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete native-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: native-latest
          name: SmartHomeKJ native (newest)
          body: The newest native build, ${{ inputs.version }}. The Flutter app stays on the main Latest release.
          target_commitish: ${{ github.sha }}
          prerelease: true

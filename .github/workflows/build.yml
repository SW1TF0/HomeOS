name: Build apps

# Builds installable apps for free on GitHub's runners.
# Every push to main uploads them as workflow artifacts. Pushing a tag like
# v1.0.0, or running this workflow by hand with a version, also publishes
# them on the Releases page.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version tag (e.g. v1.0.1). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The app's signing key is made from a secret, the same key every time, so each version installs over the
      # last one. Without the secret the APK gets a one-off key instead.
      - name: Make the signing key
        env:
          ANDROID_SIGNING_SECRET: ${{ secrets.ANDROID_SIGNING_SECRET }}
        run: |
          if [ -z "$ANDROID_SIGNING_SECRET" ]; then
            echo "::warning::No ANDROID_SIGNING_SECRET, so this APK gets a one-off key and does not install over other versions."
            ANDROID_SIGNING_SECRET=$(openssl rand -hex 32)
          fi
          pip install --quiet cryptography==50.0.1
          ANDROID_SIGNING_SECRET="$ANDROID_SIGNING_SECRET" python tool/android_key.py android/app/release-key.p12 >> "$GITHUB_ENV"
      # Obfuscated: names in the compiled code are scrambled. The symbols to read crash stacks again are kept as an
      # artifact (flutter symbolize -i <stack> -d <symbols file>).
      - run: flutter build apk --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --obfuscate --split-debug-info=build/symbols/android
      - run: mv build/app/outputs/flutter-apk/app-release.apk SmartMenuKJ-android.apk
      - name: Check which key signed the APK
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs SmartMenuKJ-android.apk
          signer=$(python tool/android_key.py --signer SmartMenuKJ-android.apk)
          echo "Signed by $signer"
          if [ "$signer" != "$APP_KEY_SHA256" ]; then
            echo "::error::The APK is not signed with the key made for it ($APP_KEY_SHA256)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-android
          path: SmartMenuKJ-android.apk
      # Google Play takes an app bundle, signed with the same key (the upload key). STORE=play: Play updates it.
      - run: flutter build appbundle --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=STORE=play --obfuscate --split-debug-info=build/symbols/play
      - run: mv build/app/outputs/bundle/release/app-release.aab SmartMenuKJ-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-play
          path: SmartMenuKJ-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-android
          path: build/symbols/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter build windows --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --obfuscate --split-debug-info=build/symbols/windows
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SmartMenuKJ-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-windows
          path: SmartMenuKJ-windows.zip
      # The Microsoft Store package. Built again with STORE=msstore so it leaves updates to the Store. Its identity
      # comes from Partner Center (Product identity) through two secrets; without them it still builds, to check.
      - run: flutter build windows --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=STORE=msstore --obfuscate --split-debug-info=build/symbols/msstore
      # Never holds up the GitHub release: without the Partner Center identity it makes a test package only.
      - name: Make the Store package
        continue-on-error: true
        shell: bash
        env:
          MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
        run: |
          args=(--store --build-windows false)
          [ -n "$MSSTORE_IDENTITY_NAME" ] && args+=(--identity-name "$MSSTORE_IDENTITY_NAME")
          if [ -n "$MSSTORE_PUBLISHER" ]; then
            args+=(--publisher "$MSSTORE_PUBLISHER")
          else
            echo "::warning::No MSSTORE_PUBLISHER secret: this .msix is a test package and cannot be uploaded to the Store (see docs/DEPLOY.md)."
            args+=(--publisher "CN=00000000-0000-0000-0000-000000000000")
          fi
          dart run msix:create "${args[@]}" --output-path . --output-name SmartMenuKJ-msstore
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-msstore
          path: SmartMenuKJ-msstore.msix
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows
          path: build/symbols/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter build linux --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --obfuscate --split-debug-info=build/symbols/linux
      - run: tar -czf SmartMenuKJ-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-linux
          path: SmartMenuKJ-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter build macos --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --obfuscate --split-debug-info=build/symbols/macos
      - run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent SmartHomeKJ.app ../../../../../SmartMenuKJ-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-macos
          path: SmartMenuKJ-macos.zip

  # iPhone and iPad. GitHub cannot sign with an Apple certificate, so this .ipa is unsigned: install it with a
  # sideloading app (AltStore, Sideloadly), which signs it with your own Apple ID. The App Store version is built
  # and signed on a Mac with ./tool/release_apple.sh (docs/DEPLOY.md).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter build ios --release --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --no-codesign --obfuscate --split-debug-info=build/symbols/ios
      - name: Package the .ipa
        run: |
          mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qry ../SmartMenuKJ-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMenuKJ-ios
          path: SmartMenuKJ-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-ios
          path: build/symbols/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [android, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    steps:
      # Only the downloads people install from GitHub. The store packages go to their stores, and the symbols
      # (which would undo the obfuscation) stay private as workflow artifacts.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: SmartMenuKJ-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartMenuKJ-android.apk
            dist/SmartMenuKJ-ios.ipa
            dist/SmartMenuKJ-windows.zip
            dist/SmartMenuKJ-macos.zip
            dist/SmartMenuKJ-linux.tar.gz
          tag_name: ${{ inputs.version || github.ref_name }}
          name: SmartHomeKJ ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
